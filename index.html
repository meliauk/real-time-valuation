<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="基攻宝 - 基金实时估值系统（多 Worker 并发版）" />
    <!-- 入口 HTML 缓存控制：meta 作为第二道防线（GitHub Pages 返回的 HTTP 响应头优先级更高，
         meta 在部分浏览器/CDN 不可靠）。主防线是 version-checker：运行时 fetch version.json?v=<时间戳>
         绕过缓存取线上最新版本，与当前运行的 __APP_VERSION__ 不一致即 location.reload()，
         确保部署后老用户自动刷到新版（无需 Ctrl+Shift+R）。见 src/shared/version/version-checker.ts。 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 浏览器标签 favicon：与 app 首页 header logo 同一 SVG（public/favicon.svg），
         Vite 构建时 href 自动加 base 前缀（/real-time-valuation/favicon.svg）。
         apple-touch-icon 供 iOS 添加到主屏图标。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>基攻宝</title>
    <script>
      // 防止主题闪烁（FOUC）：渲染前读取用户偏好设 class，默认深色
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('jgb_user_settings'));
          if (settings && settings.theme === 'light') {
            document.documentElement.classList.add('light');
          } else if (settings && settings.theme === 'pure-white') {
            document.documentElement.classList.add('pure-white');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="app">
      <div id="vue-fallback" style="color:#94a3b8;padding:24px;text-align:center;font-size:14px;">正在加载...</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
