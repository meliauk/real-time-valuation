name: Generate Star History

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动运行一次
  workflow_dispatch:     # 允许你手动点击运行

jobs:
  stargazers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Star History
        uses: wanshuiyin/star-history-action@master
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 要统计的你的仓库
          repos: L-newbie/real-time-valuation
