name: Generate Star History

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨自动更新一次
  workflow_dispatch:     # 允许你在 Actions 页面手动点击运行

jobs:
  stargazers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Star History
        uses: wanshuiyin/my-star-history@master
        with:
          # 使用 GitHub 自动生成的默认 GITHUB_TOKEN，不需要你额外配置密钥
          token: ${{ secrets.GITHUB_TOKEN }}
          # 要统计的仓库
          repo: L-newbie/real-time-valuation
