name: Generate Star History

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨全自动更新一次
  workflow_dispatch:     # 允许你随时手动点击运行

permissions:
  contents: write       # 赋予写入权限

jobs:
  star-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Star History Chart
        # 修正后的正确仓库名（去掉了横杠）
        uses: carsteneu/mystarhistory@v1
        with:
          # 直接读取当前运行的仓库，无需手动写死名字
          repos: ${{ github.repository }}
